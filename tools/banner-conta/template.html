<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>{{FONTES}}</style>
<style>
  :root { --verde: #2ee86b; --verde-forte: #16b84e; --verde-escuro: #0d6b30; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    position: relative; font-family: 'Nunito Sans', system-ui, sans-serif; color: #fff;
    background:
      radial-gradient(60% 75% at 74% 42%, rgba(30, 190, 85, .55) 0%, rgba(14, 110, 50, .35) 38%, rgba(8, 40, 20, 0) 72%),
      radial-gradient(45% 60% at 10% 100%, rgba(30, 170, 80, .22) 0%, rgba(0,0,0,0) 70%),
      linear-gradient(90deg, #0a0c0b 0%, #0b100d 40%, #0c1a11 100%);
  }
  .grade { position: absolute; inset: 0; opacity: .5;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: linear-gradient(90deg, #000 0%, rgba(0,0,0,.4) 60%, transparent 100%); }

  /* Personagens */
  .renders { position: absolute; inset: 0; }
  /* As imagens da API são quadradas com o personagem no meio: posiciona pelo centro. */
  .render { position: absolute; bottom: -60px; width: auto; object-fit: contain; transform: translateX(-50%);
    filter: drop-shadow(0 30px 40px rgba(0,0,0,.45)); }
  .r-meio { left: 1440px; height: 1150px; z-index: 3; }
  .r-dir  { left: 1745px; height: 1010px; z-index: 2; bottom: -40px; }
  .r-esq  { left: 1115px; height: 1030px; z-index: 1; bottom: -40px; }
  .r-icone { bottom: 160px; height: 640px; }

  /* Steam: capas dos jogos em leque */
  .capa { position: absolute; top: 50%; border-radius: 26px; overflow: hidden; border: 4px solid rgba(255,255,255,.9);
    box-shadow: 0 40px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.4); background: #111; }
  .capa img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .capa.r-meio { left: 1445px; width: 410px; height: 615px; transform: translate(-50%, -50%); z-index: 3; }
  .capa.r-esq  { left: 1090px; width: 360px; height: 540px; transform: translate(-50%, -45%) rotate(-9deg); z-index: 1; }
  .capa.r-dir  { left: 1785px; width: 360px; height: 540px; transform: translate(-50%, -45%) rotate(9deg); z-index: 2; }
  .capa.capa-larga img { object-position: center; }
  .steam .tile-jogo { background: #111; }
  .steam .tile-jogo img { object-position: center; }

  /* Texto */
  .txt { position: absolute; left: 112px; top: 222px; z-index: 5; }
  .pill { display: inline-flex; align-items: center; gap: 18px; height: 60px; padding: 0 28px; border-radius: 999px;
    border: 2px solid rgba(255,255,255,.16); background: rgba(10,12,11,.55);
    font-weight: 800; font-size: 29px; letter-spacing: .14em; }
  .pill .dot { width: 13px; height: 13px; border-radius: 50%; background: var(--verde); box-shadow: 0 0 12px var(--verde); }
  .pill .sep { color: rgba(255,255,255,.5); }
  .pill .sub { color: #c9d1cc; }
  .num { margin-top: 18px; display: flex; align-items: flex-end; gap: 30px; line-height: .8; }
  .num b { font-family: 'Baloo 2', system-ui; font-weight: 800; font-size: 330px; letter-spacing: -.02em; color: #fff; }
  .num span { font-family: 'Baloo 2', system-ui; font-weight: 800; font-size: 136px; color: var(--verde); margin-bottom: 14px; }
  .barra { margin-top: 20px; width: 132px; height: 8px; border-radius: 8px; background: var(--verde); }
  .dest { display: inline-block; margin-top: 26px; font-weight: 800; font-size: 44px; letter-spacing: -.005em; white-space: nowrap; }
  .dest i { font-style: normal; margin: 0 26px; color: #fff; }
  .stats { margin-top: 18px; display: flex; align-items: center; font-weight: 600; font-size: 30px; color: #b9c2bc; white-space: nowrap; }
  .stats i { width: 10px; height: 10px; margin: 0 20px; border-radius: 50%; background: var(--verde); }
  .tiles { margin-top: 30px; display: flex; gap: 14px; }
  .tile { width: 132px; height: 168px; border-radius: 10px; overflow: hidden; border: 2px solid rgba(255,255,255,.12);
    background: linear-gradient(180deg, #f7b25c 0%, #e98a3a 100%); }
  .tile img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
  .tile-mais { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    background: linear-gradient(180deg, var(--verde-forte) 0%, var(--verde-escuro) 100%); border-color: rgba(46,232,107,.6); }
  .tile-mais b { font-family: 'Baloo 2', system-ui; font-weight: 800; font-size: 46px; line-height: 1; }
  .tile-mais span { font-weight: 800; font-size: 17px; letter-spacing: .16em; }

  .marca { position: absolute; left: 112px; bottom: 52px; z-index: 5; line-height: 1; }
  .marca b { display: block; font-family: 'Baloo 2', system-ui; font-weight: 800; font-size: 40px; letter-spacing: .01em; }
  .marca span { display: block; margin-top: 4px; font-weight: 800; font-size: 17px; letter-spacing: .42em; color: var(--verde); }
</style>
</head>
<body class="{{TIPO}}">
  <div class="grade"></div>
  <div class="renders">{{RENDERS}}</div>

  <div class="txt" id="txt">
    <div class="pill"><span class="dot"></span>{{JOGO}} <span class="sep">·</span> <span class="sub">FULL ACESSO</span></div>
    <div class="num" id="num"><b>{{SKINS}}</b><span>{{UNIDADE}}</span></div>
    <div class="barra"></div>
    <div class="dest" id="dest">{{DESTAQUES}}</div>
    <div class="stats">{{STATS}}</div>
    <div class="tiles">{{TILES}}</div>
  </div>

  <div class="marca"><b>{{MARCA1}}</b><span>{{MARCA2}}</span></div>

  <script>
    // Nomes muito longos: diminui a fonte para não invadir os personagens.
    // Números grandes (3 dígitos): diminui o número para não encostar nos personagens.
    window.ajustar = function () {
      var d = document.getElementById('dest'), t = 44;
      while (d.getBoundingClientRect().width > 800 && t > 26) { t -= 2; d.style.fontSize = t + 'px'; }
      var n = document.getElementById('num'), b = n.querySelector('b'), sp = n.querySelector('span'), f = 330;
      while (n.scrollWidth > 770 && f > 200) { f -= 10; b.style.fontSize = f + 'px'; sp.style.fontSize = Math.round(f * 0.41) + 'px'; }
    };
  </script>
</body>
</html>
